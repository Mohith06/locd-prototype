<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In — LOCD Assessment Platform</title>
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
  </head>
  <body>
    <div class="center-container">
      <div class="card">
        <h1>Log In</h1>
        <p class="text-muted">LOCD Assessment Platform</p>

        <div id="login-error" class="alert alert-error" style="display: none"></div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email <span class="required-mark">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="username" />
          </div>
          <div class="field-group">
            <label for="password">Password <span class="required-mark">*</span></label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>

        <p class="form-footer-link">
          New nursing facility user? <a href="register.html">Register for access</a>
        </p>

        <hr class="divider" />
        <p class="text-muted" style="font-size: 0.85rem">
          Prototype demo accounts (password <code>demo123</code>):<br />
          jane@example.com — approved &middot;
          sam@example.com — pending &middot;
          pat@example.com — rejected &middot;
          admin@example.com — State Admin &middot;
          auditor@example.com — Auditor
        </p>
      </div>
    </div>

    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/mock-data.js"></script>
    <script src="../shared/js/state.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("login-error");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const user = findUserByEmail(email);

        if (!user || user.password !== password) {
          errorBox.textContent = "Email or password is incorrect. Please try again.";
          errorBox.style.display = "block";
          return;
        }

        errorBox.style.display = "none";
        setCurrentUser(user.id);

        if (user.registrationStatus === "approved") {
          if (user.role === "State Admin") {
            window.location.href = "../state-admin/registration-queue.html";
          } else if (user.role === "Nursing Facility User") {
            window.location.href = "../facility/dashboard.html";
          } else if (user.role === "Auditor") {
            window.location.href = "../auditor/all-locds.html";
          } else {
            window.location.href = "../shared/placeholder-dashboard.html";
          }
        } else {
          window.location.href = "registration-status.html";
        }
      });
    </script>
  </body>
</html>
